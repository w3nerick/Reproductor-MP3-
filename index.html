<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0420" />
  <title>Retro Vinyl · MP3 Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fondo synthwave: sol, montañas y grid -->
  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="sun">
      <div class="sun-stripes"></div>
    </div>
    <div class="mountains"></div>
    <div class="grid-floor"></div>
    <div class="scanlines"></div>
  </div>

  <main class="app">
    <header class="app-header">
      <div class="logo">
        <span class="logo-mark">◉</span>
        <span class="logo-text">RETRO<span>WAVE</span></span>
      </div>
      <div class="status-pill" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">Listo</span>
      </div>
    </header>

    <section class="player-card glass" aria-label="Reproductor de vinilo">
      <!-- Plato giradiscos -->
      <div class="turntable">
        <div class="platter">
          <div class="vinyl" id="vinyl">
            <div class="vinyl-grooves"></div>
            <div class="vinyl-shine"></div>
            <div class="vinyl-label">
              <div class="label-ring"></div>
              <div class="label-text">
                <span class="label-title" id="vinylTitle">Sin pista</span>
                <span class="label-artist" id="vinylArtist">Carga un MP3</span>
              </div>
              <div class="label-spindle"></div>
            </div>
          </div>
        </div>
        <!-- Brazo (tonearm) -->
        <div class="tonearm" id="tonearm">
          <div class="tonearm-base"></div>
          <div class="tonearm-arm"></div>
          <div class="tonearm-head"></div>
        </div>
      </div>

      <!-- Visualizador de audio -->
      <canvas id="visualizer" class="visualizer" width="600" height="60" aria-hidden="true"></canvas>

      <!-- Información de la pista -->
      <div class="track-info">
        <div class="track-title" id="trackTitle">Selecciona una canción</div>
        <div class="track-artist" id="trackArtist">Tu biblioteca está vacía</div>
      </div>

      <!-- Barra de progreso -->
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" role="slider" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
        </div>
        <span class="time" id="totalTime">0:00</span>
      </div>

      <!-- Controles principales -->
      <div class="controls">
        <button class="ctrl ctrl-secondary" id="shuffleBtn" aria-label="Aleatorio" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="ctrl ctrl-secondary" id="prevBtn" aria-label="Anterior">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l9-6v12z"/></svg>
        </button>
        <button class="ctrl ctrl-primary" id="playBtn" aria-label="Reproducir">
          <svg id="iconPlay" viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" width="36" height="36" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="ctrl ctrl-secondary" id="nextBtn" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M16 6h2v12h-2zM5.5 18l9-6-9-6z"/></svg>
        </button>
        <button class="ctrl ctrl-secondary" id="repeatBtn" aria-label="Repetir" aria-pressed="false" data-mode="off">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <!-- Volumen -->
      <div class="volume-row">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        <div class="volume-bar" id="volumeBar" role="slider" aria-label="Volumen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
          <div class="volume-track">
            <div class="volume-fill" id="volumeFill"></div>
            <div class="volume-thumb" id="volumeThumb"></div>
          </div>
        </div>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zM16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
      </div>
    </section>

    <!-- Playlist -->
    <section class="playlist-card glass" aria-label="Lista de reproducción">
      <div class="playlist-head">
        <h2>Mi colección</h2>
        <div class="playlist-actions">
          <label class="btn-pill" for="fileInput">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
            Añadir MP3
          </label>
          <input id="fileInput" type="file" accept="audio/mpeg,audio/mp3,audio/*" multiple hidden />
          <button class="btn-pill ghost" id="clearBtn" aria-label="Vaciar lista">Limpiar</button>
        </div>
      </div>
      <div class="dropzone" id="dropzone">
        <div class="dropzone-inner">
          <span class="dz-icon">♫</span>
          <p>Arrastra archivos MP3 aquí<br/><small>o usa el botón "Añadir MP3"</small></p>
        </div>
      </div>
      <ul class="playlist" id="playlist"></ul>
    </section>

    <footer class="app-footer">
      <span>Hecho con neón &amp; nostalgia · 1985</span>
    </footer>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
