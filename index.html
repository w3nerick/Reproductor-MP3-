<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2a1810" />
  <title>Velouria 1200 · Hi-Fi MP3 Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=VT323&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="room" aria-hidden="true">
    <div class="room-light"></div>
  </div>

  <main class="hifi">
    <!-- ================= Brand plate ================= -->
    <header class="brand">
      <div class="brand-plate">
        <span class="brand-name">VELOURIA</span>
        <span class="brand-model">DIRECT-DRIVE TURNTABLE · STEREO HI-FI · MODEL 1200</span>
      </div>
    </header>

    <!-- ================= Turntable ================= -->
    <section class="turntable" aria-label="Tocadiscos">
      <div class="plinth">
        <div class="deck-top">
          <!-- Power LED -->
          <div class="cluster cluster-power">
            <div class="led-dot" id="powerLed" aria-hidden="true"></div>
            <span class="cluster-label">POWER</span>
          </div>

          <!-- Speed buttons 33 / 45 -->
          <div class="cluster cluster-speed">
            <button class="speed-btn is-active" data-speed="33" aria-pressed="true">33</button>
            <button class="speed-btn" data-speed="45" aria-pressed="false">45</button>
            <span class="cluster-label">RPM</span>
          </div>

          <!-- Platter well with strobe ring + vinyl -->
          <div class="platter-well">
            <div class="strobe-ring" aria-hidden="true"></div>
            <div class="platter" id="platter">
              <div class="slipmat">
                <div class="vinyl" id="vinyl">
                  <div class="vinyl-grooves"></div>
                  <div class="vinyl-shine"></div>
                  <div class="vinyl-label">
                    <div class="label-ring"></div>
                    <div class="label-text">
                      <span class="label-title" id="vinylTitle">NO RECORD</span>
                      <span class="label-artist" id="vinylArtist">— LOAD A TRACK —</span>
                    </div>
                    <div class="label-spindle"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Tonearm assembly -->
          <div class="tonearm-mount">
            <div class="tonearm-pivot"></div>
            <div class="tonearm" id="tonearm">
              <div class="tonearm-counterweight"></div>
              <div class="tonearm-tube"></div>
              <div class="tonearm-headshell"></div>
            </div>
          </div>

          <!-- Cueing lever -->
          <div class="cueing">
            <span class="cueing-label">CUE</span>
            <div class="cueing-lever" id="cueingLever"></div>
          </div>

          <!-- Pitch fader (decorative) -->
          <div class="pitch-fader" aria-hidden="true">
            <span class="pitch-label">PITCH</span>
            <div class="pitch-track">
              <span class="pitch-mark pitch-mark-top"></span>
              <span class="pitch-mark pitch-mark-mid"></span>
              <span class="pitch-mark pitch-mark-bot"></span>
              <div class="pitch-handle"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= Amplifier / receiver ================= -->
    <section class="amp" aria-label="Amplificador">
      <div class="amp-case">
        <div class="amp-face">
          <!-- VU meters (stereo) -->
          <div class="vu-section">
            <div class="vu-meter">
              <canvas class="vu-canvas" data-channel="L"></canvas>
              <span class="vu-channel">L</span>
            </div>
            <div class="vu-meter">
              <canvas class="vu-canvas" data-channel="R"></canvas>
              <span class="vu-channel">R</span>
            </div>
          </div>

          <!-- LED amber display -->
          <div class="led-display">
            <div class="led-window">
              <div class="led-row led-row-top">
                <span class="led-track-num" id="ledTrackNum">--</span>
                <div class="led-marquee">
                  <span class="led-title" id="ledTitle">— NO TRACK LOADED —</span>
                </div>
              </div>
              <div class="led-row led-row-bottom">
                <span class="led-time" id="ledCurrentTime">0:00</span>
                <div class="led-bar" id="progressBar" role="slider" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                  <div class="led-bar-fill" id="ledBarFill"></div>
                  <div class="led-bar-thumb" id="ledBarThumb"></div>
                </div>
                <span class="led-time" id="ledTotalTime">0:00</span>
              </div>
            </div>
          </div>

          <!-- Transport buttons -->
          <div class="transport">
            <button class="tx-btn" id="prevBtn" aria-label="Anterior">
              <span class="tx-icon">◄◄</span>
              <span class="tx-text">PREV</span>
            </button>
            <button class="tx-btn tx-play" id="playBtn" aria-label="Reproducir">
              <span class="tx-icon" id="iconPlay">▶</span>
              <span class="tx-icon" id="iconPause" hidden>❚❚</span>
              <span class="tx-text" id="playLabel">PLAY</span>
            </button>
            <button class="tx-btn" id="nextBtn" aria-label="Siguiente">
              <span class="tx-icon">►►</span>
              <span class="tx-text">NEXT</span>
            </button>
            <button class="tx-btn tx-toggle" id="shuffleBtn" aria-pressed="false">
              <span class="tx-text">SHUF</span>
              <span class="tx-led"></span>
            </button>
            <button class="tx-btn tx-toggle" id="repeatBtn" aria-pressed="false" data-mode="off">
              <span class="tx-text">RPT</span>
              <span class="tx-led"></span>
            </button>
            <button class="tx-btn tx-toggle is-active" id="sfxBtn" aria-pressed="true" title="Efectos de tocadiscos (clicks, plop, vinilo)">
              <span class="tx-text">SFX</span>
              <span class="tx-led"></span>
            </button>
          </div>

          <!-- Volume knob -->
          <div class="knob-cluster">
            <div class="knob"
                 id="volumeKnob"
                 role="slider"
                 aria-label="Volume"
                 aria-valuemin="0"
                 aria-valuemax="100"
                 aria-valuenow="80"
                 tabindex="0">
              <div class="knob-body">
                <div class="knob-dial"></div>
                <div class="knob-indicator"></div>
              </div>
              <div class="knob-ticks" aria-hidden="true"></div>
              <span class="knob-label">VOLUME</span>
              <span class="knob-value" id="volumeValue">80</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= Track index ================= -->
    <section class="track-index" aria-label="Lista de reproducción">
      <header class="ti-head">
        <div class="ti-title">
          <h2>TRACK INDEX</h2>
          <span class="ti-count" id="trackCount">0 RECORDS</span>
        </div>
        <div class="ti-actions">
          <label class="btn-mech" for="fileInput">
            <span>+ LOAD</span>
          </label>
          <input id="fileInput" type="file" accept="audio/mpeg,audio/mp3,audio/*" multiple hidden />
          <button class="btn-mech ghost" id="clearBtn">EJECT ALL</button>
        </div>
      </header>

      <div class="dropzone" id="dropzone">
        <div class="dz-inner">
          <span class="dz-icon">♫</span>
          <p>DROP YOUR MP3 RECORDS HERE</p>
          <small>or use the LOAD button above</small>
        </div>
      </div>

      <ol class="track-list" id="playlist"></ol>
    </section>

    <footer class="foot">
      <span>HAND-CRAFTED · VELOURIA AUDIO LTD. · MCMLXXXV</span>
    </footer>
  </main>

  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
